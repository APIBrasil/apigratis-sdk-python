[tool.poetry]
name = "api-brasil"
version = "2.0.1"
description = "SDK oficial Python da plataforma APIBrasil - WhatsApp, SMS, consultas CPF/CNPJ, veículos, CEP, correios, pagamentos PIX/boleto e mais."
license = "MIT"
readme = "README.md"
authors = [
    "APIBRASIL <contato@apibrasil.com.br>",
    "Ivanildo Barauna de Souza Junior <ivanildo.jnr@outlook.com>"
]
keywords = [
    "apibrasil",
    "apigratis",
    "whatsapp",
    "api-rest",
    "brasil",
    "cep",
    "cpf",
    "cnpj",
    "correios",
    "sms",
    "pix",
    "boleto",
    "fipe",
    "placa",
    "serasa",
    "geolocation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
packages = [{ include = "api_brasil", from = "src" }]
include = [{ path = "src/api_brasil/py.typed", format = ["sdist", "wheel"] }]


[tool.poetry.dependencies]
python = ">=3.8"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
python-dotenv = "^1.0.1"
black = "^24.10.0"

[tool.poetry.urls]
Homepage = "https://apibrasil.com.br"
Documentation = "https://doc.apibrasil.io"
Repository = "https://github.com/ivanildobarauna-dev/apibrasil-py"
BugTracker = "https://github.com/ivanildobarauna-dev/apibrasil-py/issues"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"


[tool.black]
line-length = 88
target-version = ["py38"]
